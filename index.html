<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Libreta de vacas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#14284B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Libreta">
<style>
:root{
  color-scheme:light;
  --bg:#F2F4F8;--surface:#FFFFFF;--ink:#0F1B33;--muted:#58657F;--line:#D8DEEA;
  --navy:#14284B;--on-navy:#FFFFFF;--gold:#C9A227;--gold-ink:#7A5A08;
  --prenada:#1B7A4B;--servida:#6B3FA0;--vacia:#B3261E;--ciclando:#2457A6;--apta:#8A6510;--sin:#58657F;--otro:#58657F;
  --bar:#9AA9C6;--bar-last:#14284B;
  --serif:"Aptos","Aptos Display","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --sans:"Aptos","Aptos Display","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#0B1324;--surface:#131E36;--ink:#E8EDF7;--muted:#9AA8C4;--line:#243453;
    --navy:#1B2C52;--on-navy:#FFFFFF;--gold:#E3B84A;--gold-ink:#E3B84A;
    --prenada:#5FCB92;--servida:#C79BE8;--vacia:#FF8A80;--ciclando:#7FA8EE;--apta:#E5B659;--sin:#9AA8C4;--otro:#9AA8C4;
    --bar:#4A5E8A;--bar-last:#E3B84A;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
#app{max-width:640px;margin:0 auto;padding:0 0 40px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}

.top{background:var(--navy);color:var(--on-navy);padding:calc(14px + env(safe-area-inset-top)) 18px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:4px solid var(--gold)}
.top h1{font-family:var(--serif);font-size:26px;line-height:1.1;margin:0}
.top p{margin:2px 0 0;font-size:12.5px;opacity:.8}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:42px}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#14284B}
.btn.big{min-height:52px;padding:12px 26px;font-size:17px}
.top .btn{flex:none;white-space:nowrap;background:transparent;color:var(--on-navy);border-color:rgba(255,255,255,.4);min-height:38px;padding:6px 12px;font-size:14px}

main{padding:16px 16px 0}
.searchbox{position:sticky;top:0;z-index:5;background:var(--bg);padding:2px 0 12px}
#q{width:100%;min-height:58px;font-size:22px;font-family:var(--serif);padding:10px 16px;border:2px solid var(--navy);border-radius:14px;background:var(--surface)}
#q::placeholder{font-family:var(--sans);font-size:17px;color:var(--muted)}
@media (prefers-color-scheme:dark){#q{border-color:var(--gold)}}

.h{font-family:var(--serif);font-size:17px;margin:14px 0 8px;color:var(--muted);font-weight:600}
.hint{color:var(--muted);margin:18px 2px}
.error{color:var(--vacia);font-weight:600;margin:0 0 12px}

.row{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"rp who chip" "sub sub sub";gap:2px 12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;min-height:64px}
.row:active{background:var(--bg)}
.row .rp{grid-area:rp;font-family:var(--serif);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.row .who{grid-area:who;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .chip{grid-area:chip}
.row .sub{grid-area:sub;font-size:14px;color:var(--muted)}

.chip{font-size:13px;font-weight:700;border:1.5px solid currentColor;border-radius:999px;padding:1px 10px;white-space:nowrap}
.chip.prenada{color:var(--prenada)}.chip.servida{color:var(--servida)}.chip.vacia{color:var(--vacia)}.chip.ciclando{color:var(--ciclando)}.chip.apta{color:var(--apta)}.chip.sin,.chip.otro{color:var(--sin)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin-top:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:28px 20px;text-align:center;margin-top:8px}
.empty h2{font-family:var(--serif);font-size:24px;margin:0 0 8px}
.empty p{color:var(--muted);margin:0 0 18px}

.backbtn{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:8px 8px 8px 0;font-weight:600;color:var(--ciclando);cursor:pointer;min-height:44px}
.fh{margin:2px 0 14px}
.fh .big{font-family:var(--serif);font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.fh .nm{font-size:18px;color:var(--muted);margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:14px;font-weight:600}

.banner{--c:var(--sin);background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.banner.prenada{--c:var(--prenada)}.banner.servida{--c:var(--servida)}.banner.vacia{--c:var(--vacia)}.banner.ciclando{--c:var(--ciclando)}.banner.apta{--c:var(--apta)}
.banner .state{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--c);line-height:1.1;margin-bottom:6px}
.banner p{margin:4px 0}
.banner small,.kv small{color:var(--muted);font-size:14px}
.warn{color:var(--vacia);font-weight:700}

.dsc{display:inline-block;margin-left:6px;font-weight:700;color:var(--vacia)}
.descarte{display:flex;justify-content:space-between;align-items:baseline;gap:12px;background:var(--surface);border:1px solid var(--vacia);border-radius:12px;padding:12px 16px;margin-bottom:14px}
.descarte b{color:var(--vacia);font-size:17px}
.descarte span{color:var(--muted);font-size:14px}
.dscstat b{color:var(--vacia)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.card h2{font-family:var(--serif);font-size:19px;margin:0 0 6px}
.kv{margin:0}
.kv>div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:9px 0;border-top:1px solid var(--line)}
.kv>div:first-child{border-top:0}
.kv dt{color:var(--muted);font-size:15px}
.kv dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.kv dd small{display:block;font-weight:400}

.bars{width:100%;height:auto;margin-top:12px}
.bars .bar{fill:var(--bar)}
.bars .bar.last{fill:var(--bar-last)}
.bars .val{font-size:11px;fill:var(--ink);font-weight:600}
.bars .lbl{font-size:9.5px;fill:var(--muted)}
.cap{margin:4px 0 0;font-size:13px;color:var(--muted)}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div>
      <h1>Libreta</h1>
      <p id="meta"></p>
    </div>
    <button class="btn" id="btnLoad" hidden>Cambiar libreta</button>
  </header>
  <main id="main"></main>
</div>
<input id="file" type="file" accept=".xls,.xlsx,.xlsm,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
<div id="toast" role="status" aria-live="polite"></div>
<script src="xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
